<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة HMA للتجارة المحدودة | HMA Trading Co. Ltd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0a192f;
      --secondary: #0f2b48;
      --accent: #d4af37;
      --accent-hover: #b89628;
      --dark: #111827;
      --light: #f8fafc;
      --white: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --whatsapp: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    /* الهيدر وشريط التنقل */
    header {
      background: var(--primary);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-badge {
      background: linear-gradient(135deg, #d4af37, #f3e5ab, #aa771c);
      color: var(--primary);
      font-weight: 900;
      font-size: 20px;
      padding: 6px 14px;
      border-radius: 8px;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4);
    }

    .brand-text {
      color: var(--white);
      font-size: 18px;
      font-weight: 800;
    }

    .brand-text span {
      display: block;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 1.5px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--accent);
    }

    .nav-btn {
      background: var(--accent);
      color: var(--primary) !important;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 700 !important;
      transition: background 0.3s;
    }

    .nav-btn:hover {
      background: var(--accent-hover);
    }

    /* الواجهة الترحيبية */
    .hero {
      background: linear-gradient(135deg, rgba(10, 25, 47, 0.95), rgba(15, 43, 72, 0.9)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      color: var(--white);
      text-align: center;
      padding: 90px 20px 80px;
    }

    .hero-logo-box {
      margin-bottom: 20px;
    }

    .hero-logo {
      display: inline-block;
      border: 2px solid var(--accent);
      padding: 12px 30px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
    }

    .hero-logo h2 {
      font-size: 38px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .hero-logo p {
      font-size: 13px;
      color: #f1f5f9;
      letter-spacing: 2px;
      margin: 0;
    }

    .hero h1 {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .hero p.lead {
      font-size: 17px;
      color: #cbd5e1;
      max-width: 650px;
      margin: 0 auto 30px;
    }

    .hero-btns {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 2px solid var(--accent);
      color: var(--accent);
    }

    .btn-outline:hover {
      background: var(--accent);
      color: var(--primary);
    }

    /* الأقسام العامة */
    .section {
      padding: 65px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 28px;
      color: var(--secondary);
      font-weight: 800;
      margin-bottom: 8px;
    }
